services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://abronshop.online}
    restart: unless-stopped
    environment:
      API_ORIGIN: ${API_ORIGIN:-https://api.abronshop.online}
    ports:
      - "${PORT:-8080}:80"
